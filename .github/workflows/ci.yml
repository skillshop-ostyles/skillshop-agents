name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skill-anatomy:
    name: Skill Anatomy Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run local CI
        run: pwsh skills/_meta/elevate/scripts/ci-local.ps1

  powershell-lint:
    name: PowerShell Script Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PS1 files
        run: |
          pwsh -Command "
            $errors = 0
            Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
              $content = Get-Content $_ -Raw -Encoding UTF8
              if ($content -notmatch 'ErrorActionPreference\s*=\s*[\'\""]Stop[\'\""]') {
                Write-Error \"$($_.FullName): Missing ErrorActionPreference = 'Stop'\"
                $errors++
              }
              if ($content -notmatch 'ConvertTo-Json') {
                Write-Error \"$($_.FullName): No JSON output detected\"
                $errors++
              }
            }
            exit $errors
          "