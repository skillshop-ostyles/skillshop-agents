<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bibliothek — Skill-Shop</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    table.lib-table { width: 100%; border-collapse: collapse; margin: 12px 0 32px; }
    table.lib-table th, table.lib-table td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); }
    table.lib-table th { color: var(--text-muted); font-weight: 600; font-size: 0.85rem; }
  </style>
</head>
<body>
  <noscript><div class="noscript-warning">Diese Seite braucht JavaScript, um die Bibliothek zu laden.</div></noscript>

  <header id="site-header"></header>

  <div class="container" style="padding: 32px 0 64px;">
    <h1>Bibliothek</h1>
    <p class="hint-text">Der Shop installiert nur additiv. Einen Skill wieder zu entfernen, machst du direkt im Zielprojekt (Ordner unter <code>.claude/skills/</code> löschen) — der Shop räumt dort nichts automatisch weg.</p>
    <div id="targets"></div>
  </div>

  <footer class="site-footer">
    <div class="container">Skill-Shop — lokal, ohne Telemetrie.</div>
  </footer>

  <script src="shop-core.js"></script>
  <script src="app.js"></script>
  <script>
    function statusCell(skill) {
      if (!skill.present) return '<span class="badge uncurated">entfernt (manuell)</span>';
      if (skill.updateAvailable) return '<span class="badge status-soon">Update verfügbar</span>';
      return '<span class="badge status-ok">aktuell</span>';
    }

    async function reinstall(targetPath, skillName, button) {
      const ok = window.confirm(`'${skillName}' in '${targetPath}' neu installieren? Lokale Änderungen an diesem Skill-Ordner gehen dabei verloren.`);
      if (!ok) return;
      button.disabled = true;
      button.textContent = 'Installiere...';
      try {
        const res = await fetch('/api/library/reinstall', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetPath, skillName }),
        });
        const body = await res.json();
        if (!res.ok) {
          window.alert(body.error || 'Reinstall fehlgeschlagen.');
          button.disabled = false;
          button.textContent = 'Neu installieren';
          return;
        }
        await mount();
      } catch (err) {
        window.alert('Verbindung zum Shop fehlgeschlagen.');
        button.disabled = false;
        button.textContent = 'Neu installieren';
      }
    }

    async function mount() {
      const container = document.getElementById('targets');
      let library;
      try {
        library = await Shop.fetchJson('/api/library');
      } catch (err) {
        container.innerHTML = `<p class="empty-state">${Shop.escapeHtml(err.message)}</p>`;
        return;
      }

      if (library.length === 0) {
        container.innerHTML = '<p class="empty-state">Noch nichts installiert. <a href="katalog.html">Stöbere im Katalog</a>.</p>';
        return;
      }

      container.innerHTML = library.map((target) => `
        <section class="section">
          <h2>${Shop.escapeHtml(target.label || target.path)}</h2>
          <p class="hint-text">${Shop.escapeHtml(target.path)}</p>
          <table class="lib-table">
            <thead><tr><th>Skill</th><th>Trigger</th><th>Installiert am</th><th>Status</th><th></th></tr></thead>
            <tbody>
              ${target.skills.map((s) => `
                <tr>
                  <td>${Shop.escapeHtml(s.name)}</td>
                  <td><code>${Shop.escapeHtml(s.trigger)}</code></td>
                  <td>${Shop.escapeHtml(new Date(s.installedAt).toLocaleString('de-DE'))}</td>
                  <td>${statusCell(s)}</td>
                  <td><button class="btn secondary" data-target="${Shop.escapeHtml(target.path)}" data-skill="${Shop.escapeHtml(s.name)}">Neu installieren</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </section>
      `).join('');

      container.querySelectorAll('button[data-skill]').forEach((btn) => {
        btn.addEventListener('click', () => reinstall(btn.dataset.target, btn.dataset.skill, btn));
      });
    }

    mount();
  </script>
</body>
</html>
