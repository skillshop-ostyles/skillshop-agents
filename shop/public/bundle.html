<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bundle — Skill-Shop</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <noscript><div class="noscript-warning">Diese Seite braucht JavaScript, um Bundle-Daten zu laden.</div></noscript>

  <header id="site-header"></header>

  <div id="content"></div>

  <footer class="site-footer">
    <div class="container">
      <span class="foot-brand"><span class="brand-mark">/</span> Skill-Shop</span>
      <span>Lokal, ohne Telemetrie · „Skill is the hero."</span>
    </div>
  </footer>

  <script src="shop-core.js"></script>
  <script src="app.js"></script>
  <script>
    async function mount() {
      const slug = new URLSearchParams(window.location.search).get('slug');
      const content = document.getElementById('content');
      if (!slug) {
        content.innerHTML = '<p class="container empty-state">Kein Bundle angegeben.</p>';
        return;
      }
      let bundle;
      try {
        bundle = await Shop.fetchJson(`/api/bundles/${encodeURIComponent(slug)}`);
      } catch (err) {
        content.innerHTML = `<p class="container empty-state">${Shop.escapeHtml(err.message)}</p>`;
        return;
      }

      document.title = `${bundle.title} — Skill-Shop`;

      const available = bundle.skills.filter((s) => s.status === 'verfuegbar');
      const pending = bundle.skills.filter((s) => s.status !== 'verfuegbar');
      const ctaLabel = available.length === 0 ? 'Bundle merken' : 'Bundle in den Warenkorb';

      content.innerHTML = `
        <section class="bundle-hero">
          <div class="container">
            <div class="cta-row" style="margin-bottom:14px;"><span class="tag">◆ Bundle</span><span class="status-aggregate" style="margin:0;"><b>${bundle.status.verfuegbar}</b> von ${bundle.status.total} verfügbar</span></div>
            <h1>${Shop.escapeHtml(bundle.title)}</h1>
            <p class="claim">${Shop.escapeHtml(bundle.claim)}</p>
            <div class="cta-row">
              <button class="btn primary" id="bundle-cta">${ctaLabel}</button>
              ${Shop.priceLabel(bundle.price)}
              <span class="hint-text" id="bundle-hint" style="display:none;"></span>
            </div>
          </div>
        </section>

        <div class="page-body">
          <section class="section">
            <h2>Worum es geht</h2>
            <p>${Shop.escapeHtml(bundle.story)}</p>
          </section>

          <section class="section">
            <h2>Enthaltene Skills</h2>
            <div class="card-grid">${bundle.skills.map(Shop.card).join('')}</div>
          </section>
        </div>
      `;

      document.getElementById('bundle-cta').addEventListener('click', async () => {
        for (const s of available) Shop.cart.add(s.name, bundle.slug);
        for (const s of pending) {
          try {
            await fetch('/api/watchlist', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ skillName: s.name }),
            });
          } catch (err) { /* Merkliste ist ein Komfort-Feature, kein Grund den Klick abzubrechen */ }
        }

        const hint = document.getElementById('bundle-hint');
        hint.style.display = 'inline';
        if (available.length === 0) {
          hint.textContent = `Noch keiner der ${bundle.skills.length} Skills ist verfügbar - alle auf die Merkliste gelegt.`;
        } else if (pending.length === 0) {
          hint.textContent = `Alle ${available.length} Skills in den Warenkorb gelegt.`;
        } else {
          hint.textContent = `${available.length} in den Warenkorb, ${pending.length} auf die Merkliste gelegt.`;
        }
      });
    }
    mount();
  </script>
</body>
</html>
