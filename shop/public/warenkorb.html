<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Warenkorb — Skill-Shop</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <noscript><div class="noscript-warning">Diese Seite braucht JavaScript, um den Warenkorb zu laden.</div></noscript>

  <header id="site-header"></header>

  <div class="container" style="padding: 32px 0 64px;">
    <h1>Warenkorb</h1>
    <div id="cart-items"></div>

    <section class="section" id="checkout-section" style="display:none;">
      <h2>Kasse</h2>
      <form id="checkout-form">
        <p>
          <label for="target-path" style="display:block; margin-bottom:8px; font-size:0.9rem; color:var(--text-muted);">Zielprojekt (absoluter Pfad)</label>
          <input type="text" id="target-path" name="targetPath" list="known-targets" class="field-input"
                 placeholder="z. B. C:\Users\dein-name\Desktop\mein-projekt" />
          <datalist id="known-targets"></datalist>
        </p>
        <p class="hint-text" id="path-error" style="display:none; color: var(--badge-risk-text);"></p>
        <button type="submit" class="btn primary">Installieren</button>
      </form>
    </section>

    <section class="section" id="result-section" style="display:none;">
      <h2>Ergebnis</h2>
      <div id="result-content"></div>
    </section>
  </div>

  <footer class="site-footer">
    <div class="container">
      <span class="foot-brand"><span class="brand-mark">/</span> Skill-Shop</span>
      <span>Lokal, ohne Telemetrie · „Skill is the hero."</span>
    </div>
  </footer>

  <script src="shop-core.js"></script>
  <script src="app.js"></script>
  <script>
    function isAbsolutePath(p) {
      return /^[a-zA-Z]:[\\/]/.test(p) || /^\\\\/.test(p) || /^\//.test(p);
    }

    function renderItems(skills) {
      const el = document.getElementById('cart-items');
      const entries = Shop.cart.get();
      if (entries.length === 0) {
        el.innerHTML = '<p class="empty-state">Dein Warenkorb ist leer. <a href="katalog.html">Stöbere im Katalog</a>.</p>';
        document.getElementById('checkout-section').style.display = 'none';
        return;
      }
      const items = entries
        .map((entry) => ({ entry, skill: skills.find((s) => s.name === entry.name) }))
        .filter((x) => x.skill);
      const sumHtml = items.every((i) => i.skill.price)
        ? `<p class="status-aggregate">Summe: ${Shop.priceLabel({ amountCents: items.reduce((sum, i) => sum + i.skill.price.amountCents, 0), currency: items[0]?.skill.price.currency || 'EUR' })}</p>`
        : '';
      el.innerHTML = `${sumHtml}<div class="card-grid">${items.map(({ entry, skill: s }) => `
        <div class="card">
          <a class="card-cover" href="skill.html?name=${encodeURIComponent(s.name)}" aria-label="${Shop.escapeHtml(s.name)} ansehen"></a>
          <h3 class="card-title">${Shop.escapeHtml(s.name)}</h3>
          <p class="claim">${Shop.escapeHtml(s.claim)}</p>
          <div class="card-foot">${Shop.triggerChip(s.trigger)}${Shop.priceLabel(s.price)}${entry.fromBundle ? `<span class="tag tag-muted">aus Bundle ${Shop.escapeHtml(entry.fromBundle)}</span>` : ''}</div>
          <p class="card-actions"><button class="btn secondary" data-remove="${Shop.escapeHtml(s.name)}">Entfernen</button></p>
        </div>
      `).join('')}</div>`;
      el.querySelectorAll('button[data-remove]').forEach((btn) => {
        btn.addEventListener('click', () => {
          Shop.cart.remove(btn.dataset.remove);
          mount();
        });
      });
      document.getElementById('checkout-section').style.display = 'block';
    }

    async function loadKnownTargets() {
      try {
        const library = await Shop.fetchJson('/api/library');
        const datalist = document.getElementById('known-targets');
        datalist.innerHTML = library.map((t) => `<option value="${Shop.escapeHtml(t.path)}"></option>`).join('');
      } catch (err) { /* Bibliothek evtl. noch leer - kein Problem */ }
    }

    async function mount() {
      let skills = [];
      try {
        skills = await Shop.fetchJson('/api/skills');
      } catch (err) {
        document.getElementById('cart-items').innerHTML = `<p class="empty-state">${Shop.escapeHtml(err.message)}</p>`;
        return;
      }
      renderItems(skills);
      loadKnownTargets();
    }

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const targetPath = new FormData(e.target).get('targetPath').trim();
      const errorEl = document.getElementById('path-error');
      errorEl.style.display = 'none';

      if (!targetPath) {
        errorEl.textContent = 'Bitte ein Zielverzeichnis angeben.';
        errorEl.style.display = 'block';
        return;
      }
      if (!isAbsolutePath(targetPath)) {
        errorEl.textContent = 'Bitte einen absoluten Pfad angeben (z. B. C:\\... oder \\\\server\\freigabe).';
        errorEl.style.display = 'block';
        return;
      }

      const items = Shop.cart.names();
      let body;
      try {
        const res = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ targetPath, items }),
        });
        body = await res.json();
        if (!res.ok) {
          errorEl.textContent = body.error || `Fehler ${res.status}`;
          errorEl.style.display = 'block';
          return;
        }
      } catch (err) {
        errorEl.textContent = 'Verbindung zum Shop fehlgeschlagen.';
        errorEl.style.display = 'block';
        return;
      }

      for (const installed of body.installed) Shop.cart.remove(installed.name);

      const resultSection = document.getElementById('result-section');
      const resultContent = document.getElementById('result-content');
      resultSection.style.display = 'block';
      resultContent.innerHTML = `
        ${body.installed.length > 0 ? `
          <h3>Installiert</h3>
          <ul>${body.installed.map((i) => `<li><strong>${Shop.escapeHtml(i.name)}</strong> — probier's mit <code>${Shop.escapeHtml(i.trigger)}</code> in Claude Code im Zielprojekt.</li>`).join('')}</ul>
        ` : ''}
        ${body.failed.length > 0 ? `
          <h3>Fehlgeschlagen</h3>
          <ul>${body.failed.map((f) => `<li><strong>${Shop.escapeHtml(f.name)}</strong>: ${Shop.escapeHtml(f.error)}</li>`).join('')}</ul>
        ` : ''}
        ${body.skipped.length > 0 ? `
          <h3>Übersprungen (nach Fehler abgebrochen)</h3>
          <ul>${body.skipped.map((n) => `<li>${Shop.escapeHtml(n)}</li>`).join('')}</ul>
        ` : ''}
        <p><a href="bibliothek.html">Zur Bibliothek</a></p>
      `;

      mount();
    });

    mount();
  </script>
</body>
</html>
