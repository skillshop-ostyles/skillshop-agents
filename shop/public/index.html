<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill-Shop — Skill is the hero.</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <noscript><div class="noscript-warning">Diese Seite braucht JavaScript, um Produkte zu laden. Navigation per Link funktioniert trotzdem.</div></noscript>

  <header id="site-header"></header>

  <section class="hero container">
    <h1>Skill is the hero.</h1>
    <p class="subline">Marktplatz und Fachgeschäft für Claude-Code-Skills — einzeln oder im Bundle.</p>
    <form class="search-form" id="search-form">
      <input type="search" name="q" placeholder="Wonach suchst du? z. B. &quot;git&quot;, &quot;dsgvo&quot;, &quot;breaking change&quot;" aria-label="Suche" />
      <button type="submit">Suchen</button>
    </form>
    <p class="advisor-hint">Nicht sicher, was du brauchst? <a href="berater.html">Frag den Berater</a>.</p>
  </section>

  <main class="container" id="shelves"></main>

  <footer class="site-footer">
    <div class="container">Skill-Shop — lokal, ohne Telemetrie.</div>
  </footer>

  <script src="shop-core.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = new FormData(e.target).get('q');
      window.location.href = q ? `katalog.html?q=${encodeURIComponent(q)}` : 'katalog.html';
    });

    async function mountLanding() {
      const container = document.getElementById('shelves');
      try {
        const [skills, bundles, facets] = await Promise.all([
          Shop.fetchJson('/api/skills'),
          Shop.fetchJson('/api/bundles'),
          Shop.fetchJson('/api/facets'),
        ]);

        Shop.renderShelf(container, 'Neu im Regal', skills.slice(0, 6).map(Shop.card));

        const topUsecases = (facets.usecase || []).slice(0, 3);
        for (const uc of topUsecases) {
          const subset = await Shop.fetchJson(`/api/skills?usecase=${encodeURIComponent(uc.term)}`);
          Shop.renderShelf(container, `Usecase: ${uc.term}`, subset.slice(0, 6).map(Shop.card));
        }

        Shop.renderShelf(container, 'Bundles', bundles.map(Shop.bundleCard));
      } catch (err) {
        container.innerHTML = `<p class="empty-state">${Shop.escapeHtml(err.message)}</p>`;
      }
    }
    mountLanding();
  </script>
</body>
</html>
