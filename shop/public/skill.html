<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skill — Skill-Shop</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <noscript><div class="noscript-warning">Diese Seite braucht JavaScript, um Produktdaten zu laden.</div></noscript>

  <header id="site-header"></header>

  <div id="content"></div>

  <footer class="site-footer">
    <div class="container">
      <span class="foot-brand"><span class="brand-mark">/</span> Skill-Shop</span>
      <span>Lokal, ohne Telemetrie · „Skill is the hero."</span>
    </div>
  </footer>

  <script src="shop-core.js"></script>
  <script src="app.js"></script>
  <script>
    async function mount() {
      const name = new URLSearchParams(window.location.search).get('name');
      const content = document.getElementById('content');
      if (!name) {
        content.innerHTML = '<p class="container empty-state">Kein Skill angegeben.</p>';
        return;
      }
      let skill;
      try {
        skill = await Shop.fetchJson(`/api/skills/${encodeURIComponent(name)}`);
      } catch (err) {
        content.innerHTML = `<p class="container empty-state">${Shop.escapeHtml(err.message)}</p>`;
        return;
      }

      document.title = `${skill.name} — Skill-Shop`;

      const inCart = Shop.cart.has(skill.name);
      const ctaHtml = skill.status === 'verfuegbar'
        ? `<button class="btn primary" id="install-btn">${inCart ? 'Im Warenkorb ✓' : 'In den Warenkorb'}</button>`
        : `${Shop.statusBadge(skill.status)}
           <button class="btn secondary" id="watch-btn" data-watching="false">Merken</button>`;

      const bundlesHtml = skill.bundles.length > 0
        ? `<div class="card-grid">${skill.bundles.map((b) => `
            <a class="card" href="bundle.html?slug=${encodeURIComponent(b.slug)}">
              <div class="card-head"><span class="tag">◆ Bundle</span></div>
              <h3 class="card-title">${Shop.escapeHtml(b.title)}</h3>
            </a>`).join('')}</div>`
        : '<p class="hint-text">In keinem Bundle enthalten.</p>';

      const relatedHtml = skill.related.length > 0
        ? `<div class="card-grid">${skill.related.map((r) => `
            <a class="card" href="skill.html?name=${encodeURIComponent(r.name)}">
              <div class="card-head">${Shop.statusDot(r.status)}</div>
              <h3 class="card-title">${Shop.escapeHtml(r.name)}</h3>
              <p class="claim">${Shop.escapeHtml(r.claim)}</p>
            </a>`).join('')}</div>`
        : '<p class="hint-text">Keine verwandten Skills kuratiert.</p>';

      content.innerHTML = `
        <section class="product-hero">
          <div class="container">
            <div class="cta-row" style="margin-bottom:14px;"><code class="card-cmd" style="font-size:0.9rem;">${Shop.escapeHtml(skill.trigger)}</code>${Shop.statusBadge(skill.status)}</div>
            <h1>${Shop.escapeHtml(skill.name)}</h1>
            <p class="claim">${Shop.escapeHtml(skill.claim)}</p>
            <div class="cta-row">${ctaHtml}${Shop.riskBadge(skill.risk)}${Shop.priceLabel(skill.price)}</div>
          </div>
        </section>

        <div class="page-body">
          <section class="section">
            <h2>Das bekommst du</h2>
            <p>${Shop.escapeHtml(skill.long)}</p>
          </section>

          <section class="section">
            <h2>Evidenz-Versprechen</h2>
            <div class="evidence-callout">
              <span class="ico">✓</span>
              <p>Jede Aussage, die dieser Skill trifft, trägt einen Beleg — Commit-Hash, Datei:Zeile oder Zitat mit Fundstelle. <strong>Keine Behauptung ohne Beleg.</strong></p>
            </div>
          </section>

          <section class="section">
            <h2>Enthalten in Bundles</h2>
            ${bundlesHtml}
          </section>

          <section class="section">
            <h2>Verwandte Skills</h2>
            ${relatedHtml}
          </section>

          <section class="section">
            <h2>Technische Fakten</h2>
            <p class="hint-text">Trigger: <code>${Shop.escapeHtml(skill.trigger)}</code> · Risiko: ${skill.risk} · Status: ${skill.status}${skill.uncurated ? ' · unkuratiert (Ordner-Frontmatter, keine Katalog-Kuration)' : ''}</p>
          </section>
        </div>
      `;

      const installBtn = document.getElementById('install-btn');
      if (installBtn) {
        installBtn.addEventListener('click', () => {
          Shop.cart.add(skill.name);
          installBtn.textContent = 'Im Warenkorb ✓';
        });
      }

      const watchBtn = document.getElementById('watch-btn');
      if (watchBtn) {
        try {
          const watchlist = await Shop.fetchJson('/api/watchlist');
          if (watchlist.some((s) => s.name === skill.name)) {
            watchBtn.textContent = 'Gemerkt ✓';
            watchBtn.dataset.watching = 'true';
          }
        } catch (err) { /* Merkliste bleibt einfach ungemerkt sichtbar */ }

        watchBtn.addEventListener('click', async () => {
          try {
            if (watchBtn.dataset.watching === 'true') {
              await fetch(`/api/watchlist/${encodeURIComponent(skill.name)}`, { method: 'DELETE' });
              watchBtn.textContent = 'Merken';
              watchBtn.dataset.watching = 'false';
            } else {
              await fetch('/api/watchlist', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ skillName: skill.name }),
              });
              watchBtn.textContent = 'Gemerkt ✓';
              watchBtn.dataset.watching = 'true';
            }
          } catch (err) {
            watchBtn.textContent = 'Fehler beim Merken';
          }
        });
      }
    }
    mount();
  </script>
</body>
</html>
